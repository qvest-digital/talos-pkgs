name: mxlfs-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
steps:
  - sources:
      - url: https://github.com/danielclasen/mxlfs/releases/download/v{{ .mxlfs_version }}/mxlfs-{{ .mxlfs_version }}.tar.gz
        destination: mxlfs.tar.gz
        sha256: "{{ .mxlfs_sha256 }}"
        sha512: "{{ .mxlfs_sha512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
      LLVM: 1
    prepare:
      - |
        tar xf mxlfs.tar.gz --strip-components=1
    build:
      - |
        make -C /src M=$(pwd)/kernel modules
    install:
      - |
        mkdir -p /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)

        make -C /src M=$(pwd)/kernel modules_install INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1
    test:
      - |
        # https://www.kernel.org/doc/html/v4.15/admin-guide/module-signing.html#signed-modules-and-stripping
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
