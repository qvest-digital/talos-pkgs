name: fork-mxlfs-pkg

# Fork-only. The generated ci.yaml targets the self-hosted runner group
# "pkgs" that siderolabs operates and builds every target in the repo, so
# it neither starts nor finishes here. This builds mxlfs-pkg on a hosted
# runner and publishes it to the fork's own registry, the way
# fork-efa-pkg.yml builds efa-pkg.
#
# Not part of the upstream contribution: kres does not generate this file
# and the upstream PR must not carry it.

on:
  push:
    branches:
      - feat/mxlfs-pkg
    paths:
      - mxlfs-pkg/**
      - Pkgfile
      - .github/workflows/fork-mxlfs-pkg.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Full history: the Makefile takes SOURCE_DATE_EPOCH from the root
      # commit, and bldr writes it into every stage's finalize step. In a
      # shallow clone the root commit is HEAD, so the kernel stages would
      # miss the cache on every commit.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pkgfile carries the variables of every package; a push that changes
      # it builds only when one of this package's variables changed.
      - name: check for mxlfs-pkg changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          .github/fork-pkg-changed.sh 'mxlfs_(version|sha256|sha512)' \
            mxlfs-pkg .github/workflows/fork-mxlfs-pkg.yml

      # The kernel build writes tens of gigabytes. A hosted runner keeps
      # docker on /, which has roughly 20 GB free, and /mnt is the large
      # ephemeral disk. Both the toolchain removal and the move are needed:
      # the build outgrew 12 GB locally before it reached the module.
      #
      # This has to precede setup-buildx, whose builder container lives in
      # the data root being moved.
      - name: reclaim disk and move docker to /mnt
        if: steps.changes.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.changes.outputs.build == 'true'

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TAG is the pkgs revision Talos v1.13.6 pins, not what git describe
      # yields for this branch. The extension that consumes this package
      # resolves it, the Talos base and the kernel through one variable, so
      # the tag has to be the one siderolabs publishes the rest under.
      #
      # PLATFORM is amd64 only, as for efa-pkg: the EFA instance types the
      # module is tested on are x86.
      #
      # The kernel-build stage the module depends on comes from the registry
      # cache fork-kernel-build.yml writes once per pkgs revision, so only
      # the module's own steps run. The run stops when that ref is missing
      # rather than rebuild the kernel, and exports no cache: the module's
      # own steps take seconds. The cache holds the signing key that kernel
      # build generated; nothing the fork builds ships that kernel, so the
      # key signs only the fork's modules.
      #
      # Only feat/mxlfs-pkg reads the production kernel ref and pushes the
      # production tag. Any other branch reads the -test kernel ref and
      # pushes <PKGS_TAG>-citest.
      - name: build and push mxlfs-pkg
        if: steps.changes.outputs.build == 'true'
        env:
          PKGS_TAG: v1.13.0-43-gd8c80cc
          SUFFIX: ${{ github.ref != 'refs/heads/feat/mxlfs-pkg' && '-test' || '' }}
        run: |
          KERNEL_CACHE="ghcr.io/${{ github.repository_owner }}/talos-pkgs-cache:kernel-${PKGS_TAG}${SUFFIX}"
          if ! docker buildx imagetools inspect --raw "${KERNEL_CACHE}" >/dev/null; then
            echo "::error::${KERNEL_CACHE} does not exist; run fork-kernel-build first"
            exit 1
          fi
          make mxlfs-pkg PUSH=true PLATFORM=linux/amd64 \
            USERNAME=${{ github.repository_owner }} TAG="${PKGS_TAG}${SUFFIX:+-citest}" \
            CI_ARGS="--cache-from=type=registry,ref=${KERNEL_CACHE}"
