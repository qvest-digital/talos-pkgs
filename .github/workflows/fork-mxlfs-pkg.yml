name: fork-mxlfs-pkg

# Fork-only. The generated ci.yaml targets the self-hosted runner group
# "pkgs" that siderolabs operates and builds every target in the repo, so
# it neither starts nor finishes here. This builds mxlfs-pkg on a hosted
# runner and publishes it to the fork's own registry, the way
# fork-efa-pkg.yml builds efa-pkg.
#
# Not part of the upstream contribution: kres does not generate this file
# and the upstream PR must not carry it.

on:
  push:
    branches:
      - feat/mxlfs-pkg
    paths:
      - mxlfs-pkg/**
      - Pkgfile
      - .github/workflows/fork-mxlfs-pkg.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The kernel build writes tens of gigabytes. A hosted runner keeps
      # docker on /, which has roughly 20 GB free, and /mnt is the large
      # ephemeral disk. Both the toolchain removal and the move are needed:
      # the build outgrew 12 GB locally before it reached the module.
      #
      # This has to precede setup-buildx, whose builder container lives in
      # the data root being moved.
      - name: reclaim disk and move docker to /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TAG is the pkgs revision Talos v1.13.6 pins, not what git describe
      # yields for this branch. The extension that consumes this package
      # resolves it, the Talos base and the kernel through one variable, so
      # the tag has to be the one siderolabs publishes the rest under.
      #
      # PLATFORM is amd64 only, as for efa-pkg: the EFA instance types the
      # module is tested on are x86.
      # The kernel stage is most of an hour and the same for every build at
      # one pkgs revision, so it is cached in the registry, shared with
      # fork-efa-pkg.yml: after the first build at a revision, a module
      # change rebuilds the module alone. The cache holds the signing key
      # that kernel build generated; nothing the fork builds ships that
      # kernel, so the key signs only these modules.
      - name: build and push mxlfs-pkg
        env:
          PKGS_TAG: v1.13.0-43-gd8c80cc
          CACHE: ghcr.io/${{ github.repository_owner }}/talos-pkgs-cache:v1.13.0-43-gd8c80cc
        run: |
          make mxlfs-pkg PUSH=true PLATFORM=linux/amd64 \
            USERNAME=${{ github.repository_owner }} TAG="${PKGS_TAG}" \
            CI_ARGS="--cache-from=type=registry,ref=${CACHE} --cache-to=type=registry,ref=${CACHE},mode=max,ignore-error=true"
