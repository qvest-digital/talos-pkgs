name: fork-kernel-build

# Fork-only. Builds the kernel-build stage once per pkgs revision and writes
# it to a registry cache ref that the fork's module workflows read. The
# module packages depend on that stage through their pkg.yaml, so the cache
# is the kernel tree they build against; no image is published.
#
# Not part of the upstream contribution: kres does not generate this file
# and the upstream PR must not carry it.

on:
  push:
    branches:
      - feat/mxlfs-pkg
    paths:
      - base/**
      - kernel/**
      - Pkgfile
      - .github/fork-pkg-changed.sh
      - .github/workflows/fork-kernel-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Full history: the Makefile takes SOURCE_DATE_EPOCH from the root
      # commit, and bldr writes it into every stage's finalize step. In a
      # shallow clone the root commit is HEAD, so the epoch, and with it
      # every cache key from base:finalize on, would change with each commit.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pkgfile carries every package's variables; only the ones base and
      # the kernel stages template in are kernel inputs.
      - name: check for kernel changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          .github/fork-pkg-changed.sh \
            'linux_|kspp_|TOOLS_PREFIX|TOOLS_REV|LLVM_IMAGE' \
            base kernel .github/fork-pkg-changed.sh .github/workflows/fork-kernel-build.yml

      # The kernel build writes tens of gigabytes. A hosted runner keeps
      # docker on /, which has roughly 20 GB free, and /mnt is the large
      # ephemeral disk. Both the toolchain removal and the move are needed:
      # the build outgrew 12 GB locally before it reached the module.
      #
      # This has to precede setup-buildx, whose builder container lives in
      # the data root being moved.
      - name: reclaim disk and move docker to /mnt
        if: steps.changes.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.changes.outputs.build == 'true'

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PKGS_TAG is the pkgs revision Talos v1.13.6 pins, the same value the
      # module workflows use, and names the cache ref they read. Only
      # feat/mxlfs-pkg writes that ref; a run on any other branch writes
      # the same name suffixed -test.
      #
      # target-kernel-build is the Makefile's target-% rule with
      # --target=kernel-build: it builds the stage into the build cache
      # only, and --cache-to exports every intermediate step (mode=max).
      # Without ignore-error, a failed export fails the run instead of
      # leaving the module workflows without a kernel.
      #
      # The cache holds the signing key that kernel build generated; nothing
      # the fork builds ships that kernel, so the key signs only the fork's
      # modules.
      - name: build kernel-build and export the cache
        if: steps.changes.outputs.build == 'true'
        env:
          PKGS_TAG: v1.13.0-43-gd8c80cc
          SUFFIX: ${{ github.ref != 'refs/heads/feat/mxlfs-pkg' && '-test' || '' }}
        run: |
          CACHE="ghcr.io/${{ github.repository_owner }}/talos-pkgs-cache:kernel-${PKGS_TAG}${SUFFIX}"
          echo "cache ref: ${CACHE}"
          make target-kernel-build PLATFORM=linux/amd64 \
            CI_ARGS="--cache-from=type=registry,ref=${CACHE} --cache-to=type=registry,ref=${CACHE},mode=max"
