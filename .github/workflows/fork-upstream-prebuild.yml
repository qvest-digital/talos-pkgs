name: fork-upstream-prebuild

# Fork-only. Follows siderolabs/talos releases and, for each pkgs revision
# a recent release pins, prebuilds the kernel-build stage the fork's module
# packages build against: the toolchain and base stages, the kernel, and
# the signing key that build generates. A branch that carries the fork
# layer onto that pin then finds the stage in the registry cache instead
# of spending about two hours on it.
#
# The releases followed are the latest patch of each of the two newest
# minors with a stable release, and, when dispatched with prereleases set,
# the newest pre-release of a newer minor. The pkgs revision is the PKGS
# pin in that release's Makefile. A revision is built from siderolabs/pkgs
# itself, since the fork layer changes no kernel input, and exported with
# mode=max to talos-pkgs-cache:kernel-<PKGS>-prebuild. A revision whose
# kernel-<PKGS>, -test or -prebuild ref already exists is not built.
# fork-kernel-build.yml on a branch reads the -prebuild ref as an extra
# --cache-from and writes its own refs; this workflow writes no other ref.
#
# For every revision it also cherry-picks the fork layer of fork_branch,
# the commits on it that no siderolabs/pkgs branch or tag contains, onto
# that revision without pushing, and reports in the job summary whether
# they apply. It opens nothing.
#
# It lives on main because a schedule trigger runs only from the default
# branch. main is otherwise a mirror of siderolabs/pkgs main; with this
# file on it, a sync from upstream is a merge, not a fast-forward. Not
# part of any upstream contribution: kres does not generate it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      prereleases:
        description: also follow the newest pre-release of a newer minor
        type: boolean
        default: false
      fork_branch:
        description: branch whose fork layer is checked against each pin
        type: string
        default: feat/mxlfs-pkg-v1.14

permissions:
  contents: read
  packages: write

# One run at a time. Branch builds write other cache refs, so they do not
# share this group.
concurrency:
  group: fork-upstream-prebuild
  cancel-in-progress: false

env:
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/talos-pkgs-cache

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      pins: ${{ steps.pins.outputs.pins }}
    steps:
      - name: resolve the pkgs revisions recent Talos releases pin
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASES: ${{ inputs.prereleases || false }}
        run: |
          set -euo pipefail
          releases=$(gh api 'repos/siderolabs/talos/releases?per_page=100' \
            --jq '.[] | select(.draft | not) | [.tag_name, .prerelease] | @tsv')
          # Newest first; the first tag of each minor is its latest patch.
          tags=$(awk '$2 == "false" {print $1}' <<<"${releases}" | sort -rV |
            awk -F. '!seen[$1 "." $2]++' | head -n 2)
          newest=$(head -n 1 <<<"${tags}" | cut -d. -f1,2)
          if [ "${PRERELEASES}" = true ]; then
            pre=$(awk '$2 == "true" {print $1}' <<<"${releases}" | sort -rV | head -n 1)
            minor=$(cut -d. -f1,2 <<<"${pre}")
            if [ -n "${pre}" ] && [ "${minor}" != "${newest}" ] &&
              [ "$(printf '%s\n%s\n' "${minor}" "${newest}" | sort -V | tail -n 1)" = "${minor}" ]; then
              tags=$(printf '%s\n%s\n' "${pre}" "${tags}")
            fi
          fi
          pins='[]'
          for tag in ${tags}; do
            pkgs=$(gh api "repos/siderolabs/talos/contents/Makefile?ref=${tag}" --jq .content |
              base64 -d | sed -n 's/^PKGS ?= //p')
            [ -n "${pkgs}" ] || { echo "::error::no PKGS pin in the ${tag} Makefile"; exit 1; }
            echo "${tag} pins pkgs ${pkgs}"
            pins=$(jq -c --arg t "${tag}" --arg p "${pkgs}" '. + [{talos: $t, pkgs: $p}]' <<<"${pins}")
          done
          # Two releases can pin one revision; it is built once.
          echo "pins=$(jq -c 'group_by(.pkgs) | map({pkgs: .[0].pkgs, talos: (map(.talos) | join(" "))})' <<<"${pins}")" >>"${GITHUB_OUTPUT}"

  prebuild:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.resolve.outputs.pins) }}
    env:
      PKGS: ${{ matrix.pin.pkgs }}
      TALOS: ${{ matrix.pin.talos }}
      FORK_BRANCH: ${{ inputs.fork_branch || 'feat/mxlfs-pkg-v1.14' }}
    steps:
      # Full history and every branch and tag: the Makefile takes
      # SOURCE_DATE_EPOCH from the root commit, which bldr writes into
      # every finalize step, and the fork layer is what no upstream ref
      # contains.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: siderolabs/pkgs
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: check out the pinned revision and look for its kernel cache
        id: cache
        run: |
          set -euo pipefail
          # v1.14.0-48-gf4bda77 names commit f4bda77; a bare tag names itself.
          rev=${PKGS}
          [[ "${PKGS}" =~ -g([0-9a-f]+)$ ]] && rev=${BASH_REMATCH[1]}
          git checkout -q --detach "${rev}"
          echo "pkgs ${PKGS} is $(git rev-parse HEAD)"
          for suffix in "" -test -prebuild; do
            if docker buildx imagetools inspect --raw "${CACHE_REPO}:kernel-${PKGS}${suffix}" >/dev/null 2>&1; then
              echo "found ${CACHE_REPO}:kernel-${PKGS}${suffix}"
              echo "existing=kernel-${PKGS}${suffix}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "existing=" >>"${GITHUB_OUTPUT}"

      - name: check that the fork layer applies
        id: layer
        env:
          FORK_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch -q "${FORK_URL}" "+refs/heads/${FORK_BRANCH}:refs/fork/layer"
          commits=$(git rev-list --reverse --no-merges refs/fork/layer --not --remotes=origin --tags)
          n=$(grep -c . <<<"${commits}" || true)
          # A separate worktree, so the build below sees the pin unchanged.
          git worktree add -q --detach "${RUNNER_TEMP}/layer" HEAD
          cd "${RUNNER_TEMP}/layer"
          result="applies cleanly (${n} commits)"
          for c in ${commits}; do
            if ! git -c user.name=ci -c user.email=ci@invalid cherry-pick --keep-redundant-commits "${c}" >/dev/null 2>&1; then
              files=$(git diff --name-only --diff-filter=U | paste -sd ' ')
              result="conflicts at $(git log -1 --format='%h %s' "${c}"): ${files}"
              git cherry-pick --abort
              break
            fi
          done
          echo "${result}"
          echo "result=${result}" >>"${GITHUB_OUTPUT}"

      # The kernel build writes tens of gigabytes; / on a hosted runner
      # has about 20 GB free and /mnt is the large ephemeral disk. This
      # precedes setup-buildx, whose builder lives in the data root.
      - name: reclaim disk and move docker to /mnt
        if: steps.cache.outputs.existing == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.cache.outputs.existing == ''

      - name: build kernel-build and export the cache
        id: build
        if: steps.cache.outputs.existing == ''
        run: |
          CACHE="${CACHE_REPO}:kernel-${PKGS}-prebuild"
          echo "cache ref: ${CACHE}"
          make target-kernel-build PLATFORM=linux/amd64 \
            CI_ARGS="--cache-from=type=registry,ref=${CACHE} --cache-to=type=registry,ref=${CACHE},mode=max"

      - name: summary
        if: always()
        env:
          EXISTING: ${{ steps.cache.outputs.existing }}
          BUILD: ${{ steps.build.outcome }}
          LAYER: ${{ steps.layer.outputs.result }}
        run: |
          if [ -n "${EXISTING}" ]; then
            kernel="already cached as ${EXISTING}"
          elif [ "${BUILD}" = success ]; then
            kernel="new pin: prebuilt ${CACHE_REPO}:kernel-${PKGS}-prebuild"
          else
            kernel="prebuild ${BUILD:-not run}"
          fi
          {
            echo "### Talos ${TALOS}: pkgs ${PKGS}"
            echo "- kernel-build: ${kernel}"
            echo "- fork layer of ${FORK_BRANCH}: ${LAYER:-not checked}"
          } >>"${GITHUB_STEP_SUMMARY}"
