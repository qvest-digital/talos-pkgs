name: intel-e810-oot-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
steps:
  - sources:
      - url: https://github.com/intel/ethernet-linux-ice/releases/download/v{{ .ice_oot_version }}/ice-{{ .ice_oot_version }}.tar.gz
        destination: ice.tar.gz
        sha256: "{{ .ice_oot_sha256 }}"
        sha512: "{{ .ice_oot_sha512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
      LLVM: 1
    prepare:
      # The patches are the ones Media Transport Library carries for this
      # ice release, from patches/ice_drv/2.6.7 at commit
      # bb37c66178d48736bf3764d2c9e6366263b3e97b of
      # github.com/OpenVisualCloud/Media-Transport-Library. They add VF
      # runtime rate-limit queue reconfiguration and fix the legacy
      # MAP_QUEUE_VECTOR size; the last one renames the driver version, so
      # the version string identifies a patched build.
      - |
        mkdir ice
        tar xf ice.tar.gz -C ice --strip-components=1

        cd ice
        for p in /pkg/patches/*.patch; do
          patch -p1 < "${p}"
        done

        grep -qF '"Kahawai_{{ .ice_oot_version }}"' src/ice_main.c
    build:
      # The driver's own Makefile runs kcompat-generator.sh against KSRC,
      # which probes the kernel headers and decides the compat code paths,
      # then calls the kernel build. CC is set for the Makefile's own
      # preprocessor calls; LLVM=1 makes the kernel build use clang, as the
      # kernel itself was built.
      - |
        make -C ice/src KSRC=/src CC=clang
    install:
      # modules_install of the kernel, not of the driver: the driver's
      # target also runs depmod and installs the DDP into /lib/firmware.
      # The kernel's signs the module with the key of the kernel-build
      # stage, as CONFIG_MODULE_SIG_ALL asks.
      #
      # The DDP goes to firmware/updates, which the kernel firmware loader
      # searches before firmware/, so it takes precedence over the DDP that
      # linux-firmware ships at the same name without replacing that file.
      - |
        mkdir -p /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)

        make -C /src M=$(pwd)/ice/src KSRC=/src CC=clang modules_install INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1

        ddp=$(echo ice/ddp/ice-*.pkg)
        install -D -m 0644 "${ddp}" /rootfs/usr/lib/firmware/updates/intel/ice/ddp/$(basename "${ddp}")
        ln -s $(basename "${ddp}") /rootfs/usr/lib/firmware/updates/intel/ice/ddp/ice.pkg
        install -D -m 0644 ice/ddp/LICENSE /rootfs/usr/lib/firmware/updates/intel/ice/ddp/LICENSE
    test:
      # Every module must be signed and carry the vermagic of the kernel it
      # was built against: a module from another pkgs revision does not
      # load. ice must be the patched build.
      - |
        krel=$(cat /src/include/config/kernel.release)
        modules=$(find /rootfs/usr/lib/modules -name '*.ko')
        [ -n "${modules}" ]

        for ko in ${modules}; do
          tail -c 28 "${ko}" | grep -qF '~Module signature appended~' || { echo "unsigned: ${ko}"; exit 1; }

          vermagic=$(tr '\0' '\n' < "${ko}" | sed -n 's/^vermagic=//p')
          [ "${vermagic%% *}" = "${krel}" ] || { echo "${ko}: vermagic '${vermagic}', kernel ${krel}"; exit 1; }
        done

        ice=/rootfs/usr/lib/modules/${krel}/extras/ice.ko
        tr '\0' '\n' < "${ice}" | grep -qx 'version=Kahawai_{{ .ice_oot_version }}'

        [ -f /rootfs/usr/lib/firmware/updates/intel/ice/ddp/ice.pkg ]
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
